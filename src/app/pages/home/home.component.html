<app-menu-title></app-menu-title>

<div class="filtros">
  <input
    type="text"
    placeholder="Buscar matéria..."
    [(ngModel)]="searchTerm"
    class="filtros__busca"
  >

  <div class="filtros__categorias">
    <button
      *ngFor="let cat of categories"
      (click)="filterByCategory(cat)"
      [class.ativo]="selectedCategory === cat"
    >
      {{ cat }}
    </button>
  </div>
</div>

<div class="container__articles" *ngIf="mainArticle">
  <div class="articles__main">

    <app-big-card
      [Id]="mainArticle.id"
      [photoCover]="mainArticle.photoCover"
      [cardTitle]="mainArticle.title"
      [cardDescription]="mainArticle.description"
      >
    </app-big-card>

  </div>
  <div class="articles__others">

    <app-small-card
      *ngFor="let article of otherArticles"
      [Id]="article.id"
      [cardTitle]="article.title"
      [photoCover]="article.photoCover"
    >
    </app-small-card>

  </div>
</div>

<p *ngIf="!mainArticle" class="sem-resultado">Nenhuma matéria encontrada.</p>
